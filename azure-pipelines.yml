# ==============================================================================
# Azure DevOps CI/CD Pipeline - Le Restaurant
# ==============================================================================
#
# Complete CI/CD pipeline for Le Restaurant application:
# - Frontend: React 18 + TypeScript + Vite → Azure Static Web Apps
# - Backend: Spring Boot 3.x + Java 17 → Azure App Service
#
# Pipeline Stages:
# 1. Code Quality & Linting
# 2. Build & Test with Coverage (Unit Tests + E2E Integration Tests)
# 3. Security Scanning
# 4. Deploy to Azure (Production)
#
# Testing Strategy:
# - Backend Unit Tests: 80% coverage threshold (JaCoCo)
# - E2E Integration Tests: 10 Scenario-based tests covering F100-F109
#   * BaseE2ETest: Abstract base class with shared helper methods
#   * Scenario1-10: Independent test scenarios with Separation of Concerns
#
# Author: Le Restaurant Development Team
# Version: 2.1.0
# Last Updated: October 23, 2025
# ==============================================================================

# Trigger Configuration - DISABLED (Manual trigger only)
trigger: none

# Pull Request Validation - DISABLED
pr: none

# Pipeline Resources
pool:
  vmImage: ubuntu-latest

# ==============================================================================
# GLOBAL VARIABLES
# ==============================================================================
variables:
  # Version Configuration
  NODE_VERSION: 20.x
  JAVA_VERSION: '17'

  # Path Configuration
  FRONTEND_PATH: frontend
  BACKEND_PATH: backend

  # Coverage Thresholds
  FRONTEND_COVERAGE_THRESHOLD: '80'
  BACKEND_COVERAGE_THRESHOLD: '80'

  # Azure Resource Names (Update these with your Azure resources)
  # TODO: Replace with your actual Azure service connection name from Azure DevOps
  # AZURE_SUBSCRIPTION: YOUR_AZURE_SUBSCRIPTION_NAME
  # BACKEND_APP_NAME: le-restaurant-backend
  # FRONTEND_APP_NAME: le-restaurant-frontend
  # RESOURCE_GROUP: le-restaurant-rg

  # Build Configuration
  BACKEND_JAR_NAME: le-restaurant-backend-0.0.1-SNAPSHOT.jar
  FRONTEND_BUILD_OUTPUT: dist

# ==============================================================================
# STAGE 1: CODE QUALITY & LINTING
# ==============================================================================
stages:
  - stage: CodeQuality
    displayName: '🔍 Code Quality & Linting'
    jobs:
      # Frontend Linting
      - job: FrontendLint
        displayName: Frontend ESLint Analysis
        steps:
          - checkout: self
            fetchDepth: 1

          - task: NodeTool@0
            displayName: 'Install Node.js $(NODE_VERSION)'
            inputs:
              versionSpec: $(NODE_VERSION)

          - task: Cache@2
            displayName: Cache npm dependencies
            inputs:
              key: 'npm | "$(Agent.OS)" | $(FRONTEND_PATH)/package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: $(FRONTEND_PATH)/node_modules

          - script: |
              cd $(FRONTEND_PATH)
              npm ci
            displayName: '📦 Install Dependencies'

          - script: |
              cd $(FRONTEND_PATH)
              npm run lint
            displayName: '🔎 Run ESLint'
            continueOnError: true

      # Backend Code Analysis
      - job: BackendLint
        displayName: Backend Code Analysis
        steps:
          - checkout: self
            fetchDepth: 1

          - task: JavaToolInstaller@0
            displayName: 'Install Java $(JAVA_VERSION)'
            inputs:
              versionSpec: $(JAVA_VERSION)
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled

          - task: Cache@2
            displayName: Cache Gradle Dependencies
            inputs:
              key: 'gradle | "$(Agent.OS)" | $(BACKEND_PATH)/gradle/wrapper/gradle-wrapper.properties'
              restoreKeys: |
                gradle | "$(Agent.OS)"
              path: /home/vsts/.gradle/caches

          - script: |
              cd $(BACKEND_PATH)
              chmod +x gradlew
              ./gradlew check -x test
            displayName: '🔎 Run Checkstyle'
            continueOnError: true

  # ==============================================================================
  # STAGE 2: BUILD & TEST
  # ==============================================================================
  - stage: BuildAndTest
    displayName: '🔨 Build & Test'
    dependsOn: CodeQuality
    condition: succeeded()
    jobs:
      # Frontend Build & Test
      - job: FrontendBuildTest
        displayName: Frontend Build & Test with Coverage
        steps:
          - checkout: self
            fetchDepth: 1

          - task: NodeTool@0
            displayName: 'Install Node.js $(NODE_VERSION)'
            inputs:
              versionSpec: $(NODE_VERSION)

          - task: Cache@2
            displayName: Cache npm dependencies
            inputs:
              key: 'npm | "$(Agent.OS)" | $(FRONTEND_PATH)/package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: $(FRONTEND_PATH)/node_modules

          - script: |
              cd $(FRONTEND_PATH)
              npm ci
            displayName: '📦 Install Dependencies'

          - script: |
              cd $(FRONTEND_PATH)
              npm run test:coverage
            displayName: '🧪 Run Tests with Coverage'
            continueOnError: false

          - task: PublishCodeCoverageResults@2
            displayName: '📊 Publish Frontend Coverage'
            inputs:
              codeCoverageTool: Cobertura
              summaryFileLocation: '$(FRONTEND_PATH)/coverage/cobertura-coverage.xml'
              pathToSources: '$(FRONTEND_PATH)/src'
              failIfCoverageEmpty: true

          - script: |
              cd $(FRONTEND_PATH)
              COVERAGE=$(grep -oP '(?<=lines>)[0-9.]+' coverage/cobertura-coverage.xml | head -1)
              echo "Coverage: $COVERAGE%"
              if (( $(echo "$COVERAGE < $(FRONTEND_COVERAGE_THRESHOLD)" | bc -l) )); then
                echo "##vso[task.logissue type=error]Coverage $COVERAGE% is below threshold $(FRONTEND_COVERAGE_THRESHOLD)%"
                exit 1
              fi
            displayName: '✅ Verify Coverage Threshold'
            condition: always()

          - script: |
              cd $(FRONTEND_PATH)
              npm run build
            displayName: '🏗️ Build Frontend'

          - task: PublishPipelineArtifact@1
            displayName: '📦 Publish Frontend Artifact'
            inputs:
              targetPath: $(FRONTEND_PATH)/$(FRONTEND_BUILD_OUTPUT)
              artifact: frontend-build
              publishLocation: pipeline

      # Backend Build & Test
      - job: BackendBuildTest
        displayName: Backend Build & Test with Coverage
        steps:
          - checkout: self
            fetchDepth: 1

          - task: JavaToolInstaller@0
            displayName: 'Install Java $(JAVA_VERSION)'
            inputs:
              versionSpec: $(JAVA_VERSION)
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled

          - task: Cache@2
            displayName: Cache Gradle Dependencies
            inputs:
              key: 'gradle | "$(Agent.OS)" | $(BACKEND_PATH)/gradle/wrapper/gradle-wrapper.properties'
              restoreKeys: |
                gradle | "$(Agent.OS)"
              path: /home/vsts/.gradle/caches

          - script: |
              cd $(BACKEND_PATH)
              chmod +x gradlew
              ./gradlew clean test jacocoTestReport --stacktrace
            displayName: '🧪 Run Tests with Coverage'

          - task: PublishTestResults@2
            displayName: '📊 Publish Test Results'
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: '$(BACKEND_PATH)/build/test-results/test/*.xml'
              failTaskOnFailedTests: true
              testRunTitle: 'Backend Unit Tests'

          - task: PublishCodeCoverageResults@2
            displayName: '📊 Publish Backend Coverage'
            inputs:
              codeCoverageTool: JaCoCo
              summaryFileLocation: '$(BACKEND_PATH)/build/reports/jacoco/test/jacocoTestReport.xml'
              pathToSources: '$(BACKEND_PATH)/src/main/java'
              failIfCoverageEmpty: true

          - script: |
              cd $(BACKEND_PATH)
              ./gradlew jacocoTestCoverageVerification
            displayName: '✅ Verify Coverage Threshold'
            condition: always()

          - script: |
              cd $(BACKEND_PATH)
              ./gradlew bootJar
            displayName: '🏗️ Build Backend JAR'

          - task: CopyFiles@2
            displayName: '📋 Copy Backend Artifact'
            inputs:
              sourceFolder: '$(BACKEND_PATH)/build/libs'
              contents: '*.jar'
              targetFolder: $(Build.ArtifactStagingDirectory)/backend

          - task: PublishPipelineArtifact@1
            displayName: '📦 Publish Backend Artifact'
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/backend
              artifact: backend-build
              publishLocation: pipeline

      # JavaScript API Integration Tests
      - job: JsIntegrationTests
        displayName: JavaScript API Integration Tests
        dependsOn: BackendBuildTest
        steps:
          - checkout: self
            fetchDepth: 1

          - task: JavaToolInstaller@0
            displayName: 'Install Java $(JAVA_VERSION)'
            inputs:
              versionSpec: $(JAVA_VERSION)
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled

          - task: NodeTool@0
            displayName: 'Install Node.js $(NODE_VERSION)'
            inputs:
              versionSpec: $(NODE_VERSION)

          - task: Cache@2
            displayName: Cache Gradle Dependencies
            inputs:
              key: 'gradle | "$(Agent.OS)" | $(BACKEND_PATH)/gradle/wrapper/gradle-wrapper.properties'
              restoreKeys: |
                gradle | "$(Agent.OS)"
              path: /home/vsts/.gradle/caches

          - script: |
              cd $(BACKEND_PATH)
              chmod +x gradlew
              ./gradlew bootRun --args='--spring.profiles.active=default' &
              BACKEND_PID=$!
              echo "Backend PID: $BACKEND_PID"
              # Wait for backend to start (up to 60 seconds)
              for i in $(seq 1 12); do
                sleep 5
                if curl -sf http://localhost:8080/api/health > /dev/null 2>&1; then
                  echo "✅ Backend is up after $((i * 5)) seconds"
                  break
                fi
                echo "Waiting for backend... ($((i * 5))s)"
              done
            displayName: '🚀 Start Backend for Integration Tests'

          - script: |
              cd integration-tests
              npm install
              BASE_URL=http://localhost:8080 npx jest --testTimeout=15000 --forceExit
            displayName: '🧪 Run JavaScript Integration Tests'
            continueOnError: true

          - task: PublishTestResults@2
            displayName: '📊 Publish JS Integration Test Results'
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: 'integration-tests/junit-report/*.xml'
              failTaskOnFailedTests: false
              testRunTitle: 'JavaScript API Integration Tests'
            condition: always()

      # E2E Integration Tests (Scenario Tests)
      - job: E2EIntegrationTests
        displayName: E2E Integration Tests (Scenario Tests)
        dependsOn: []
        steps:
          - checkout: self
            fetchDepth: 1

          - task: JavaToolInstaller@0
            displayName: 'Install Java $(JAVA_VERSION)'
            inputs:
              versionSpec: $(JAVA_VERSION)
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled

          - task: Cache@2
            displayName: Cache Gradle Dependencies
            inputs:
              key: 'gradle | "$(Agent.OS)" | $(BACKEND_PATH)/gradle/wrapper/gradle-wrapper.properties'
              restoreKeys: |
                gradle | "$(Agent.OS)"
              path: /home/vsts/.gradle/caches

          - script: |
              cd $(BACKEND_PATH)
              chmod +x gradlew
              ./gradlew test --tests "*Scenario*" --stacktrace
            displayName: '🧪 Run E2E Scenario Tests'
            continueOnError: false

          - task: PublishTestResults@2
            displayName: '📊 Publish E2E Test Results'
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: '$(BACKEND_PATH)/build/test-results/test/*.xml'
              failTaskOnFailedTests: true
              testRunTitle: 'E2E Integration Tests (Scenario 1-10)'
            condition: always()

          - script: |
              echo "📋 E2E Test Coverage Summary:"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "✅ Scenario 1: New Customer Full Journey (F100-F109)"
              echo "✅ Scenario 2: Manager User Account Management (F100-F102)"
              echo "✅ Scenario 3: Menu Lifecycle & Order Impact (F103-F105)"
              echo "✅ Scenario 4: Payment Failure & Retry (F105-F106)"
              echo "✅ Scenario 5: Reservation Conflicts & Rejections (F108-F109)"
              echo "✅ Scenario 6: Order Cancellation by Manager (F105-F106)"
              echo "✅ Scenario 7: Unauthorized Access Attempts (F101-F102,F104,F109)"
              echo "✅ Scenario 8: Delivery Driver Workflow (F105-F107)"
              echo "✅ Scenario 9: High-Volume Concurrent Orders (F105)"
              echo "✅ Scenario 10: Full Refund Process (F105-F107)"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "📊 All E2E tests completed successfully!"
            displayName: '📋 E2E Test Summary'
            condition: always()

  # ==============================================================================
  # STAGE 3: SECURITY SCANNING
  # ==============================================================================
  - stage: SecurityScan
    displayName: '🔒 Security Scanning'
    dependsOn: BuildAndTest
    condition: succeeded()
    jobs:
      - job: DependencyScan
        displayName: Dependency Vulnerability Scan
        steps:
          - checkout: self
            fetchDepth: 1

          # Frontend Security Scan
          - task: NodeTool@0
            displayName: 'Install Node.js $(NODE_VERSION)'
            inputs:
              versionSpec: $(NODE_VERSION)

          - script: |
              cd $(FRONTEND_PATH)
              npm ci
              npm audit --production --audit-level=high
            displayName: '🔍 Frontend Security Audit'
            continueOnError: true

          # Backend Security Scan
          - task: JavaToolInstaller@0
            displayName: 'Install Java $(JAVA_VERSION)'
            inputs:
              versionSpec: $(JAVA_VERSION)
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled

          - script: |
              cd $(BACKEND_PATH)
              chmod +x gradlew
              ./gradlew dependencyCheckAnalyze || true
            displayName: '🔍 Backend Dependency Check'
            continueOnError: true

  # ==============================================================================
  # STAGE 4: PLAYWRIGHT BROWSER E2E TESTS
  # ==============================================================================
  - stage: PlaywrightE2E
    displayName: '🎭 Browser E2E Tests (Playwright)'
    dependsOn: BuildAndTest
    condition: succeeded()
    jobs:
      - job: PlaywrightTests
        displayName: Playwright Browser E2E Tests
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            fetchDepth: 1

          - task: JavaToolInstaller@0
            displayName: 'Install Java $(JAVA_VERSION)'
            inputs:
              versionSpec: $(JAVA_VERSION)
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled

          - task: NodeTool@0
            displayName: 'Install Node.js $(NODE_VERSION)'
            inputs:
              versionSpec: $(NODE_VERSION)

          - task: Cache@2
            displayName: Cache Gradle Dependencies
            inputs:
              key: 'gradle | "$(Agent.OS)" | $(BACKEND_PATH)/gradle/wrapper/gradle-wrapper.properties'
              restoreKeys: |
                gradle | "$(Agent.OS)"
              path: /home/vsts/.gradle/caches

          - script: |
              # Start backend
              cd $(BACKEND_PATH)
              chmod +x gradlew
              ./gradlew bootRun &
              for i in $(seq 1 12); do
                sleep 5
                if curl -sf http://localhost:8080/api/health > /dev/null 2>&1; then
                  echo "✅ Backend ready"
                  break
                fi
              done

              # Build and preview frontend
              cd $(Build.SourcesDirectory)/$(FRONTEND_PATH)
              npm ci
              npm run build
              npm run preview &
              sleep 8
              echo "✅ Frontend preview started on port 4173"
            displayName: '🚀 Start Full Stack for E2E Tests'

          - script: |
              cd e2e
              npm install
              npx playwright install --with-deps chromium
            displayName: '📦 Install Playwright'

          - script: |
              cd e2e
              BASE_URL=http://localhost:4173 npx playwright test --reporter=junit,html
            displayName: '🧪 Run Playwright E2E Tests'
            continueOnError: true

          - task: PublishTestResults@2
            displayName: '📊 Publish Playwright Results'
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: 'e2e/playwright-report/results.xml'
              failTaskOnFailedTests: false
              testRunTitle: 'Browser E2E Tests (Playwright)'
            condition: always()

          - task: PublishPipelineArtifact@1
            displayName: '📦 Publish Playwright HTML Report'
            inputs:
              targetPath: 'e2e/playwright-report'
              artifact: playwright-report
            condition: always()


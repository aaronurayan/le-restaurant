# GitHub Actions Workflow for Le Restaurant
# Builds and deploys Spring Boot backend to Azure App Service

name: Deploy to Azure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: le-restaurant
  JAVA_VERSION: '17'
  
jobs:
  # Verification gate: tests must pass before anything is deployed.
  verify:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'gradle'

    - name: Test and Build with Gradle
      run: |
        cd backend
        chmod +x gradlew
        ./gradlew clean test bootJar

    - name: Publish Test Results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Backend Tests
        path: backend/build/test-results/test/*.xml
        reporter: java-junit
        fail-on-error: false

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: backend-jar
        path: backend/build/libs/*.jar

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: verify          # deploy only runs if the verify job (tests) succeeded
    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: backend-jar
        path: backend/build/libs

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: backend/build/libs/*.jar
